services:
  mysql:
    image: mysql:8.4
    container_name: fencewatch-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fencewatch
      MYSQL_USER: fencewatch
      MYSQL_PASSWORD: fencewatch
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - fencewatch-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fencewatch-mysql-data:
